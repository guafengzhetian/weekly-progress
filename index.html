<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c8644f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="周报进度" />
    <link rel="dns-prefetch" href="https://gitee.com" />
    <link rel="preconnect" href="https://gitee.com" crossorigin />
    <title>周报进度</title>
  </head>
  <body>
    <div id="root">
      <p id="boot-fallback" style="margin:24px;font:16px/1.5 system-ui,sans-serif;color:#444">
        加载中…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        var el = document.getElementById('boot-fallback')
        if (el && document.getElementById('root') && document.getElementById('root').children.length === 1) {
          el.textContent = '页面脚本未加载。请连同一 Wi‑Fi 打开电脑提供的地址，或稍后再试。'
        }
      }, 8000)
    </script>
  </body>
</html>
